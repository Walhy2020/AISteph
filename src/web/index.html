<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="aisteph-token" content="__AISTEPH_TOKEN__">
  <meta name="aisteph-version" content="__AISTEPH_VERSION__">
  <title>AISteph · 录音工作台</title>
  <link rel="stylesheet" href="/assets/styles.css">
</head>
<body>
  <div class="ambient ambient-blue"></div>
  <div class="ambient ambient-red"></div>

  <header class="topbar">
    <a class="brand" href="/" aria-label="AISteph 录音工作台首页">
      <span class="brand-mark">A</span>
      <span>
        <strong>AISteph</strong>
        <small>RECORDING WORKSPACE</small>
      </span>
    </a>
    <div class="topbar-meta">
      <span class="service-pill" id="service-status">
        <span class="service-dot"></span>
        <span>正在连接</span>
      </span>
      <span class="version-pill">v__AISTEPH_VERSION__</span>
    </div>
  </header>

  <main class="page-shell">
    <section class="workspace">
      <section class="recorder-panel">

        <div class="recording-console idle" id="recorder-status" aria-live="polite">
          <div class="recording-orbit">
            <span class="recording-core"></span>
          </div>
          <div class="recording-state">
            <span id="recorder-state-label">准备录音</span>
            <strong id="recorder-duration">00:00</strong>
            <small id="recorder-device-label">请选择麦克风</small>
          </div>
        </div>

        <div class="recorder-fields">
          <div class="recorder-field">
            <span>录音设备</span>
            <div class="device-row">
              <select id="recorder-device" aria-label="录音麦克风">
                <option value="">正在读取麦克风…</option>
              </select>
              <button class="device-settings-button" id="recorder-settings-toggle" type="button"
                aria-label="录音设备设置" aria-expanded="false" aria-controls="recorder-settings-panel"
                title="录音设备设置">
                <span aria-hidden="true">⚙</span>
              </button>
              <button class="secondary-button" id="refresh-devices" type="button">刷新</button>
            </div>
            <div class="device-settings-panel" id="recorder-settings-panel" hidden>
              <div class="gain-heading">
                <span>录音增益</span>
                <output id="recorder-gain-value" for="recorder-gain">0 dB</output>
              </div>
              <input id="recorder-gain" type="range" min="0" max="24" step="1" value="0"
                aria-label="录音增益，单位分贝">
              <div class="gain-scale" aria-hidden="true">
                <span>原始</span>
                <span>更响</span>
              </div>
            </div>
          </div>
          <label>
            <span>这段录音的标题 <small>选填</small></span>
            <input id="recorder-title" type="text" maxlength="200" placeholder="未填写时使用开始录音时间">
          </label>
        </div>

        <div class="recording-actions">
          <button class="record-toggle-button" id="recording-toggle" type="button">
            <span class="record-toggle-icon"></span>
            <span class="record-toggle-label">开始录音</span>
          </button>
        </div>

        <div class="form-message" id="form-message" role="status" aria-live="polite"></div>

        <div class="recorder-footnote">
          <span>OPUS · 48 KHZ</span>
          <span>停止后自动校验并进入资料库</span>
        </div>
      </section>

      <section class="library-panel">
        <div class="section-heading library-heading">
          <div>
            <span class="section-kicker">RECORDINGS</span>
            <h2>录音资料库</h2>
          </div>
          <button class="refresh-button" id="refresh-recordings" type="button" aria-label="刷新录音资料库">
            <span aria-hidden="true">↻</span>
            <span>刷新</span>
          </button>
        </div>

        <div class="recording-list" id="recording-list" aria-live="polite">
          <article class="skeleton-card">
            <span class="skeleton-line wide"></span>
            <span class="skeleton-line"></span>
            <span class="skeleton-player"></span>
          </article>
          <article class="skeleton-card">
            <span class="skeleton-line wide"></span>
            <span class="skeleton-line short"></span>
            <span class="skeleton-player"></span>
          </article>
        </div>
      </section>
    </section>
  </main>

  <footer class="footer">
    <span>AISteph v__AISTEPH_VERSION__ · Recording Workspace</span>
    <span>本地录音 · 人工确认 · 来源可追溯</span>
  </footer>

  <template id="recording-card-template">
    <article class="recording-card">
      <header class="card-header">
        <div class="card-title-wrap">
          <div>
            <h3></h3>
            <time class="captured-time"></time>
          </div>
        </div>
        <span class="duration-label"></span>
      </header>
      <audio controls preload="metadata"></audio>
    </article>
  </template>

  <script src="/assets/app.js" defer></script>
</body>
</html>
